<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Diario de Brownie</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna tipo ficha clínica. Arriba el resumen de hoy; debajo una pestaña por cada tema de salud. */
:root{
  --bg:#F2F5F1; --surface:#FBFCFA; --ink:#15231C; --ink-2:#4B5C52; --line:#D8E0D9;
  --accent:#6B3F22; --focus:#1F6F5C;
  --ok:#2C7A4B; --warn:#A86A12; --crit:#B03A2E;
  --t-poop:#8A5A33; --t-food:#C08A1E; --t-mood:#3E8E7E; --t-med:#4F6FB5; --t-exam:#8B5FA8;
  --t-symptom:#C0503F; --t-weight:#5F7F4E; --t-vet:#2F7C8F; --t-other:#7B8580;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101814; --surface:#17211B; --ink:#E6EEE8; --ink-2:#9DB0A4; --line:#2A3830;
    --accent:#D9A27A; --focus:#6CC7B0;
    --ok:#5DBB82; --warn:#E0A24A; --crit:#E57A6C;
    --t-poop:#C79A6E; --t-food:#E0B04A; --t-mood:#5FC2AF; --t-med:#8AA6E6; --t-exam:#C39AE0;
    --t-symptom:#EE8574; --t-weight:#9CC083; --t-vet:#62BFD3; --t-other:#9AA59F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101814; --surface:#17211B; --ink:#E6EEE8; --ink-2:#9DB0A4; --line:#2A3830;
  --accent:#D9A27A; --focus:#6CC7B0;
  --ok:#5DBB82; --warn:#E0A24A; --crit:#E57A6C;
  --t-poop:#C79A6E; --t-food:#E0B04A; --t-mood:#5FC2AF; --t-med:#8AA6E6; --t-exam:#C39AE0;
  --t-symptom:#EE8574; --t-weight:#9CC083; --t-vet:#62BFD3; --t-other:#9AA59F; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font:400 15px/1.5 var(--f-body);
  padding-block:20px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{width:100%;min-width:0;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.sec{display:flex;flex-direction:column;gap:12px;width:100%;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{margin:0;font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:6px 0 0;font:700 clamp(36px,9vw,52px)/1 var(--f-display);letter-spacing:-.025em;color:var(--accent)}
.now{margin:0;font:400 13px var(--f-mono);color:var(--ink-2)}

.alerts{display:flex;flex-direction:column;gap:6px}
.alerts p{margin:0;padding:10px 12px;border-radius:8px;font-size:14px;
  background:color-mix(in srgb,var(--crit) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--crit) 35%,var(--line))}
.alerts b{color:var(--crit)}

.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ledger>div{background:var(--surface);padding:12px 14px;min-width:0}
.ledger>div:last-child:nth-child(odd){grid-column:1/-1}
.ledger .k{display:block;font:500 11px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.ledger .v{display:block;margin-top:6px;font:600 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.ledger .s{display:block;margin-top:2px;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.hint{margin:0;font-size:13px;color:var(--ink-2)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 12px;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.cnt{margin-left:6px;font:400 11px var(--f-mono);color:var(--ink-2)}
.view{display:flex;flex-direction:column;gap:16px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-size:13px;background:transparent;border:1px solid var(--line);border-radius:999px}
.fchip i{width:8px;height:8px;border-radius:50%;background:var(--dot)}
.fchip[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);font-weight:600}
.day h2,.group h2{margin:0 0 2px;font:600 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.group h2 span{font-weight:400;text-transform:none;letter-spacing:0}
.list{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:3.6rem 10px minmax(0,1fr);gap:0 12px;padding:12px 0;border-top:1px solid var(--line)}
.entry .time{font:400 13px/1.7 var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:pre-line}
.entry .dot{width:10px;height:10px;margin-top:7px;border-radius:50%;background:var(--dot)}
.t-poop{--dot:var(--t-poop)}.t-food{--dot:var(--t-food)}.t-mood{--dot:var(--t-mood)}.t-med{--dot:var(--t-med)}
.t-exam{--dot:var(--t-exam)}.t-symptom{--dot:var(--t-symptom)}.t-weight{--dot:var(--t-weight)}.t-vet{--dot:var(--t-vet)}.t-other{--dot:var(--t-other)}
.entry .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.entry .type{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.entry .title{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{padding:1px 7px;font:400 12px/1.6 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:4px;overflow-wrap:anywhere}
.chip em{font-style:normal;color:var(--ink-2)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.entry .note{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.entry .alert{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--crit)}
.foot{margin-top:6px;display:flex;gap:10px;align-items:center;font-size:12px}
.linkbtn{padding:0;background:none;border:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
.linkbtn.danger{color:var(--crit)}
.empty{padding:28px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-2)}
.empty b{display:block;margin-bottom:4px;color:var(--ink);font:600 17px var(--f-display)}
.empty p{margin:0}

.med{padding:14px 0;border-top:1px solid var(--line)}
.med h3{margin:0;font:600 17px var(--f-display)}
.med .meta{margin:2px 0 8px;font-size:13px;color:var(--ink-2)}
.med ul{margin:0;padding:0;list-style:none;font:400 13px/1.7 var(--f-mono);color:var(--ink-2)}

.chartbox{padding:12px 12px 8px}
.chartbox h2{margin:0 0 6px 4px;font:600 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.chartbox svg{display:block;width:100%;height:auto}
.ch-grid{stroke:var(--line);stroke-width:1;fill:none}
.ch-line{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-t{fill:var(--ink-2);font:11px var(--f-mono)}
.ch-v{fill:var(--ink);font:600 12px var(--f-mono)}
.ch-dot{stroke:var(--surface);stroke-width:2}
.ch-mood .ch-line{stroke:var(--t-mood)} .ch-mood .ch-dot{fill:var(--t-mood)}
.ch-weight .ch-line{stroke:var(--t-weight)} .ch-weight .ch-dot{fill:var(--t-weight)}

.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.days{border-collapse:collapse;font:400 12px var(--f-mono);font-variant-numeric:tabular-nums;width:100%}
.days th,.days td{padding:0;text-align:center;border:1px solid var(--line);min-width:36px;height:34px}
.days thead th{height:auto;padding:6px 2px;font-weight:400;color:var(--ink-2)}
.days thead th.today{color:var(--accent);font-weight:500}
.days tbody th{text-align:left;padding:0 10px;min-width:84px;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--surface);position:sticky;left:0}
.days td.m1,.days td.m2{background:color-mix(in srgb,var(--crit) 28%,var(--surface))}
.days td.m3{background:color-mix(in srgb,var(--ink-2) 14%,var(--surface))}
.days td.m4{background:color-mix(in srgb,var(--t-mood) 30%,var(--surface))}
.days td.m5{background:color-mix(in srgb,var(--t-mood) 55%,var(--surface))}
.days td.flag{background:color-mix(in srgb,var(--warn) 32%,var(--surface));font-weight:500}
.days td.zero{color:var(--ink-2);opacity:.6}
.legend{margin:0;font-size:13px;color:var(--ink-2)}
.btn{padding:9px 16px;font-weight:600;border-radius:8px;border:1px solid var(--line);background:transparent}
.ledger .v.sm{font-size:16px;line-height:1.3}
#dosesToday h2{margin:0 0 6px;font:600 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
#dosesToday h2 span{font-weight:400;text-transform:none;letter-spacing:0}
.medrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:10px 0;border-top:1px solid var(--line)}
.medname{display:flex;flex-direction:column;min-width:0}
.medmeta{font-size:13px;color:var(--ink-2)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-weight:500}
.slot:disabled{cursor:default;opacity:.7}
.slot.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.tick{width:18px;height:18px;border:2px solid var(--ink-2);border-radius:5px;position:relative;flex:none}
.slot.on .tick{background:var(--ok);border-color:var(--ok)}
.slot.on .tick::after{content:"";position:absolute;left:4px;top:0;width:5px;height:9px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.when{font:400 12px var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
pre.summary{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:400 13px/1.6 var(--f-mono)}
.ch-lab .ch-line{stroke:var(--t-exam)} .ch-lab .ch-dot{fill:var(--t-exam)}
.chartbox .ch-dot.bad{fill:var(--crit)}
.ch-band{fill:color-mix(in srgb,var(--ok) 16%,transparent);stroke:none}
.fchip i.baddot{background:var(--crit)}
.rtable{border-collapse:collapse;font:400 12px var(--f-mono);font-variant-numeric:tabular-nums;width:100%}
.rtable th,.rtable td{padding:6px 10px;text-align:center;border:1px solid var(--line)}
.rtable thead th{font-weight:400;color:var(--ink-2)}
.rtable th.l{text-align:left;font-weight:500;white-space:nowrap}
.rtable td.zero{color:var(--ink-2);opacity:.6}
.st-bad{color:var(--crit);font-weight:600}
.st-ok{color:var(--ok)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 16px;border-radius:8px;
  background:var(--ink);color:var(--bg);font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:480px){
  .entry{grid-template-columns:3.1rem 10px minmax(0,1fr);gap:0 10px}
}

/* Inicio estilo app: ficha de la mascota, módulos por área y barra inferior */
body{padding-block:16px 104px}
.hero{position:relative;display:flex;gap:16px;align-items:center;padding:18px;border-radius:20px;border:1px solid var(--line);
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface) 70%)}
.avatar{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#FFF7EE;
  background:linear-gradient(145deg,#8A5530,#5A3319);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.avatar svg{width:40px;height:40px;fill:currentColor}
.hero h1{margin:4px 0 8px}
.hero .now{position:absolute;top:14px;right:16px;font-size:12px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{padding:3px 10px;font-size:12px;border-radius:999px;background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--line);color:var(--ink-2)}
.pchip b{color:var(--ink);font-weight:600}
.sect{margin:6px 2px -6px;font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px;min-height:132px;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;position:relative;
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.tile:hover{transform:translateY(-2px);border-color:var(--mc);box-shadow:0 8px 20px color-mix(in srgb,var(--mc) 16%,transparent)}
.ibub{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:8px;
  color:var(--mc);background:color-mix(in srgb,var(--mc) 16%,var(--surface))}
.ibub svg,.nav svg,.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .tt{font:600 16px var(--f-display)}
.tile .mv{margin-top:auto;font:600 20px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.tile .ms{font-size:12px;color:var(--ink-2);line-height:1.3}
.tile .go{position:absolute;top:14px;right:14px;color:var(--ink-2);font-size:18px;line-height:1}
.mhead{display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:4px;padding:8px 12px 8px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500}
.mtitle{display:flex;align-items:center;gap:10px;min-width:0}
.mtitle .ibub{margin:0;width:36px;height:36px}
.mtitle h2{margin:0;font:700 24px var(--f-display);letter-spacing:-.01em}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;white-space:nowrap;font-size:14px;color:var(--ink-2)}
.pill svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill[aria-current="page"]{background:color-mix(in srgb,var(--mc) 16%,var(--surface));border-color:var(--mc);color:var(--ink);font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--bg) 60%,transparent)}
.nav>div{display:flex;gap:4px;width:100%;max-width:480px;padding:6px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:0;background:none;border-radius:16px;font-size:11px;font-weight:500;color:var(--ink-2)}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);font-weight:600}
.toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
@media (max-width:480px){.hero{padding:14px}.avatar{width:60px;height:60px}.avatar svg{width:32px;height:32px}.hero{flex-wrap:wrap}.hero .now{position:static;width:100%}}
.diet h2{margin:0 0 6px;font:600 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.diet h2 span{font-weight:400;text-transform:none;letter-spacing:0}
.diet .per{margin:10px 0 0;font-size:14px}
.diet .per b{font-weight:600}
.diet details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.diet summary{cursor:pointer;font-weight:500;color:var(--ink-2)}
.diet summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dgroup{margin:12px 0 2px;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.ditem{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.ditem .dn{min-width:0}
.ditem .dn small{display:block;font-size:12px;color:var(--ink-2)}
.ditem .dq{flex:none;text-align:right;font:500 13px var(--f-mono)}
.ditem .dq small{display:block;font:400 12px var(--f-body);color:var(--ink-2)}
.ditem .dq{max-width:46%}
.dtips{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
@media (min-width:1000px){.wgrid{grid-template-columns:repeat(7,minmax(0,1fr))}}
.wmeas{display:flex;flex-direction:column;gap:4px}
.wamt{display:flex;align-items:center;gap:6px;padding:0 4px 0 30px;font:400 12px var(--f-mono);color:var(--ink-2)}
.wamt input{width:52px;padding:4px 6px;font:500 13px var(--f-mono);text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.wday{display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;align-content:start}
.wday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wh{display:flex;flex-direction:column;padding:2px 2px 4px}
.wh small{font-size:12px;color:var(--ink-2);text-transform:capitalize}
.wbox{width:100%;align-items:flex-start;padding:7px 8px;gap:7px;font-size:13px;text-align:left}
.wbox .wn{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.wbox .wn small{font:400 11px var(--f-mono);color:var(--ink-2)}
.fhead{display:flex;align-items:center;gap:16px}
.ring{flex:none;width:84px;height:84px;position:relative}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .rb{fill:none;stroke:var(--line);stroke-width:9}
.ring .rf{fill:none;stroke:var(--ok);stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .3s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.fhead h3{margin:0;font:700 20px var(--f-display)}
.fhead p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ftile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;min-height:140px;padding:14px;
  background:var(--surface);border:1.5px solid var(--line);border-radius:18px;transition:background .15s,border-color .15s,transform .1s}
.ftile:active{transform:scale(.98)}
.ftile:disabled{cursor:default;opacity:.75}
.ftile .fic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:6px;color:var(--gc);background:color-mix(in srgb,var(--gc) 16%,var(--surface))}
.ftile .fic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ftile .chk{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.ftile .chk svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ftile.on{background:color-mix(in srgb,var(--gc) 13%,var(--surface));border-color:var(--gc)}
.ftile.on .chk{background:var(--gc);border-color:var(--gc);color:var(--surface)}
.ftile .fg{font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gc)}
.ftile .fn{font:600 15px/1.25 var(--f-display)}
.ftile .fq{font:500 13px var(--f-mono)}
.ftile .fs{font-size:12px;line-height:1.35;color:var(--ink-2)}
.ftile .fw{margin-top:auto;padding-top:6px;font:500 11px var(--f-mono);color:var(--gc)}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;font-size:12px;font-weight:500;text-align:center}
.qk .ibub{margin:0;width:44px;height:44px;border-radius:14px}
.qk:active{transform:scale(.97)}
.mhead .me{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500;font-size:13px}
.mhead .me .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#FFF7EE;background:linear-gradient(145deg,#8A5530,#5A3319)}
.mhead .me .av svg{width:16px;height:16px;fill:currentColor}
.hero .avatar{border:0;cursor:pointer}
.bub{max-width:86%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.bub small{display:block;margin-top:4px;font:400 11px var(--f-mono);opacity:.7}
.bub.me{align-self:flex-end;border-bottom-right-radius:6px;background:var(--accent);color:var(--surface)}
.bub.pet{align-self:flex-start;border-bottom-left-radius:6px;background:var(--surface);border:1px solid var(--line)}
.bub.pet b{display:block;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.bub.warn{border-color:var(--crit)}
.chat{display:flex;flex-direction:column;gap:8px}
.pf{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.pf dt{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding-top:3px}
.pf dd{margin:0;font-weight:500}
.nav button{font-size:10px;padding:6px 2px}
.nav svg{width:22px;height:22px}
.pawf{fill:currentColor!important;stroke:none!important}

/* Estilo Petly: verde profundo, tarjetas blancas, avisos lavanda, barra inferior de 5 pestañas */
:root{--bg:#F4F7F5;--surface:#FFFFFF;--ink:#14231C;--ink-2:#64746B;--line:#E3E9E5;--accent:#0E7A5C;--focus:#0E7A5C;
  --info-bg:#EEEBFB;--info-ink:#4A3F9E;
  --f-display:'Instrument Sans','Segoe UI',system-ui,sans-serif;--f-mono:'Instrument Sans','Segoe UI',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1713;--surface:#18231D;--ink:#E8F0EB;--ink-2:#9BB0A5;--line:#2A382F;--accent:#3FC79E;--focus:#3FC79E;--info-bg:#25224A;--info-ink:#C2BBF7}}
:root[data-theme="dark"]{--bg:#0F1713;--surface:#18231D;--ink:#E8F0EB;--ink-2:#9BB0A5;--line:#2A382F;--accent:#3FC79E;--focus:#3FC79E;--info-bg:#25224A;--info-ink:#C2BBF7}
h1{font-weight:700;letter-spacing:-.02em}
.card,.ledger,.tile,.qk,.ftile{border-radius:16px}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface) 75%)}
.avatar,.mhead .me .av,.th .av{background:linear-gradient(145deg,#14A07A,#0A5A44)!important}
.eyebrow,.sect,.ledger .k,.dgroup{letter-spacing:.06em}
.th{display:flex;align-items:center;justify-content:space-between;gap:12px}
.th h2{margin:0;font:700 30px/1.1 var(--f-display);letter-spacing:-.02em}
.th p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.th .acts{display:flex;align-items:center;gap:10px}
.plus{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--accent);color:#fff}
.plus svg,.icb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.av{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff}
.av svg{width:22px;height:22px;fill:currentColor}
.sh{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.sh h2{margin:0;text-align:center;font:600 18px var(--f-display)}
.icb{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icb.g{color:var(--accent)}
.info{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--info-bg);color:var(--info-ink);font-size:14px;line-height:1.4}
.info svg{flex:none;width:18px;height:18px;margin-top:1px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.crow{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.crow:first-child{border-top:0}
.crow .ibub{margin:0;width:42px;height:42px;border-radius:12px;flex:none}
.crow .ct{flex:1;min-width:0}
.crow .ct b{display:block;font:600 16px var(--f-display)}
.crow .ct small{display:block;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .chev{color:var(--ink-2);font-size:20px}
.list0{padding:0;overflow:hidden}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:16px}
.cta svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.wcard .big{font:700 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.wcard .big small{font-size:20px;font-weight:600;margin-left:4px}
.pill2{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--crit) 14%,var(--surface));color:var(--crit)}
.pill2.mid{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.arow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.arow h3{margin:0;font:600 17px var(--f-display)}
.nav>div{max-width:520px}
.composer{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.composer>div{pointer-events:auto;display:flex;gap:8px;align-items:flex-end;width:100%;max-width:720px;padding:8px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.composer textarea{flex:1;min-width:0;resize:none;max-height:120px;padding:9px 10px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:none}
.composer .plus{flex:none}
.composer .stop{flex:none;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.bub.saved{align-self:flex-start;background:color-mix(in srgb,var(--ok) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 40%,var(--line));font-size:13px}
.bub.pet{white-space:pre-wrap}
.chatpad{height:150px}
.fbar{display:block;width:100%;height:6px;margin-top:6px;border-radius:999px;background:color-mix(in srgb,var(--gc) 16%,var(--line));overflow:hidden}
.fbar i{display:block;height:100%;background:var(--gc);border-radius:999px}
.ftile.sel{border-color:var(--gc);box-shadow:0 0 0 2px color-mix(in srgb,var(--gc) 30%,transparent)}
.sheet>div{border-radius:20px}
.sheet input{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.sheet input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
</style>

        toast('Selecciona el texto y cópialo');
      };
      try { navigator.clipboard.writeText(text).then(function () { toast('Resumen copiado'); }, fallback); } catch (err) { fallback(); }
    }}, 'Copiar resumen');
    return h('div', {class:'view'},
      h('p', {class:'hint'}, 'Texto para mostrar o enviar al veterinario. Se arma con lo registrado en los últimos 30 días.'),
      h('div', {class:'card'}, pre), h('div', null, btn));
  }

  /* ---------- reportes ---------- */
  function fmtNum(v) { return (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100) + ''; }
  function fmtYmd(s) { return fmtShort(s) + ' ' + s.slice(0, 4); }
  function labData() {
    var by = {};
    entries.filter(function (e) { return e.type === 'exam' && e.labs && typeof e.labs === 'object'; }).sort(byAsc).forEach(function (e) {
      var grp = /bioqu/i.test(e.title) ? 'Bioquímica' : /hemograma/i.test(e.title) ? 'Hemograma' : 'Otros';
      Object.keys(e.labs).forEach(function (k) {
        var x = e.labs[k], v = num(x && x.v);
        if (v == null) return;
        var lo = num(x.lo), hi = num(x.hi);
        var o = by[k] || (by[k] = {name:k, grp:grp, u:'', lo:null, hi:null, pts:[]});
        o.u = x.u || o.u; o.lo = lo != null ? lo : o.lo; o.hi = hi != null ? hi : o.hi;
        o.pts.push({d:e.date, v:v, bad:(lo != null && v < lo) || (hi != null && v > hi)});
      });
    });
    return by;
  }
  function reportLabs() {
    var by = labData(), names = Object.keys(by);
    var sec = h('section', {class:'group'}, h('h2', null, 'Laboratorio ', h('span', null, '· evolución de cada valor')));
    if (!names.length) { sec.append(h('p', {class:'hint'}, 'Aún no hay valores de laboratorio con formato. Claude los agrega cuando le cuentas o le pasas un examen.')); return sec; }
    var groups = ['Bioquímica', 'Hemograma', 'Otros'].filter(function (g) { return names.some(function (n) { return by[n].grp === g; }); });
    if (groups.indexOf(labGroup) < 0) labGroup = groups[0];
    var inG = names.filter(function (n) { return by[n].grp === labGroup; });
    if (inG.indexOf(labParam) < 0) labParam = inG[0];
    var o = by[labParam], pts = o.pts;
    var gchips = groups.map(function (g) {
      return h('button', {class:'fchip', type:'button', 'aria-pressed': String(g === labGroup), onclick:function () { labGroup = g; renderView(); }}, g);
    });
    var pchips = inG.map(function (n) {
      var last = by[n].pts[by[n].pts.length - 1];
      return h('button', {class:'fchip', type:'button', 'aria-pressed': String(n === labParam), onclick:function () { labParam = n; renderView(); }},
        last.bad ? h('i', {class:'baddot', title:'Último valor fuera de rango'}) : null, n);
    });
    var outNow = inG.filter(function (n) { var l = by[n].pts[by[n].pts.length - 1]; return l.bad; });
    var vals = pts.map(function (p) { return p.v; }).concat([o.lo, o.hi].filter(function (x) { return x != null; }));
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), pad = Math.max((hi - lo) * 0.12, 0.01);
    var min = lo - pad, max = hi + pad;
    if (lo >= 0) min = Math.max(0, min);
    var ticks = [0, 1, 2, 3].map(function (i) { return min + (max - min) * i / 3; });
    var range = o.lo != null && o.hi != null ? 'rango del laboratorio ' + fmtNum(o.lo) + ' a ' + fmtNum(o.hi) : '';
    var chart = lineChart(pts, {min:min, max:max, ticks:ticks, band: o.lo != null && o.hi != null ? {lo:o.lo, hi:o.hi} : null, fmt:fmtNum,
      cls:'ch-lab', title: labParam + (o.u ? ' (' + o.u + ')' : '') + (range ? ', ' + range : ''), label:'Evolución de ' + labParam});
    var rows = pts.slice().reverse().map(function (p) {
      var st = p.bad ? (o.lo != null && p.v < o.lo ? 'Bajo' : 'Alto') : 'Dentro del rango';
      return h('tr', null, h('th', {class:'l'}, fmtYmd(p.d)), h('td', null, fmtNum(p.v) + (o.u ? ' ' + o.u : '')), h('td', {class: p.bad ? 'st-bad' : 'st-ok'}, st));
    });
    sec.append(h('div', {class:'view'},
      h('div', {class:'filters'}, gchips), h('div', {class:'filters'}, pchips),
      outNow.length ? h('p', {class:'hint'}, 'Fuera de rango en el último examen de este grupo: ' + outNow.join(', ') + '.') : h('p', {class:'hint'}, 'Todo dentro de rango en el último examen de este grupo.'),
      chart,
      h('div', {class:'gridwrap'}, h('table', {class:'rtable'}, h('thead', null, h('tr', null, h('th', {class:'l'}, 'Fecha'), h('th', null, 'Valor'), h('th', null, 'Estado'))), h('tbody', null, rows))),
      h('p', {class:'legend'}, 'La banda verde es el rango de referencia que imprime el laboratorio. Los puntos rojos están fuera de ese rango.')));
    return sec;
  }

  function weekStart(s) { var d = parseYmd(s); return addDays(s, -((d.getDay() + 6) % 7)); }
  function reportWeeks() {
    var t = todayStr(), cur = weekStart(t), weeks = [];
    for (var i = 7; i >= 0; i--) weeks.push(addDays(cur, -7 * i));
    var cols = ['Semana', 'Popó', 'Para vigilar', 'Comidas', 'Dosis', 'Ánimo', 'Síntomas', 'Exámenes'];
    var head = h('tr', null, cols.map(function (x, i) { return h('th', {class: i ? '' : 'l'}, x); }));
    var rows = weeks.map(function (w) {
      var end = addDays(w, 6);
      var inW = entries.filter(function (e) { return e.date >= w && e.date <= end; });
      var poops = inW.filter(function (e) { return e.type === 'poop'; });
      var pc = poops.reduce(function (a, e) { return a + (num(det(e).count) || 1); }, 0);
      var bad = poops.filter(isBadPoop).length;
      var food = inW.filter(function (e) { return e.type === 'food' && det(e).status !== 'plan'; }).length;
      var dose = inW.filter(isDose).length;
      var mood = avgOf(inW.filter(function (e) { return e.type === 'mood'; }));
      var sym = inW.filter(function (e) { return e.type === 'symptom'; }).length;
      var ex = inW.filter(function (e) { return e.type === 'exam'; }).length;
      var vals = [pc, bad, food, dose, mood, sym, ex];
      return h('tr', null, h('th', {class:'l'}, fmtShort(w) + ' – ' + fmtShort(end) + (w === cur ? ' (esta)' : '')),
        vals.map(function (v) { return v ? h('td', null, String(v)) : h('td', {class:'zero'}, '·'); }));
    });
    return h('section', {class:'group'}, h('h2', null, 'Semana a semana ', h('span', null, '· últimas 8 semanas, de lunes a domingo')),
      h('div', {class:'gridwrap'}, h('table', {class:'rtable'}, h('thead', null, head), h('tbody', null, rows))),
      h('p', {class:'legend'}, 'Ánimo es el promedio de 1 a 5. Para vigilar cuenta popó con sangre, moco o líquida. Un punto significa sin registros.'));
  }

  function csvCell(v) { var s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function entriesCsv() {
    var head = ['fecha', 'hora', 'tipo', 'titulo', 'estado', 'resultado', 'dosis', 'frecuencia', 'lugar_o_laboratorio', 'veterinario', 'valores_laboratorio', 'nota', 'aviso'];
    var rows = entries.slice().sort(byAsc).map(function (e) {
      var d = det(e);
      var vals = e.labs && typeof e.labs === 'object' ? Object.keys(e.labs).map(function (k) { var x = e.labs[k] || {}; return k + '=' + x.v + (x.u ? ' ' + x.u : ''); }).join(' | ') : '';
      return [e.date, e.time || '', TYPES[e.type] ? TYPES[e.type].label : e.type, e.title, d.status || '', d.result || '', d.dose || '', d.frequency || '',
        d.lab || d.clinic || '', d.vet || '', vals, e.note || '', e.alert || ''].map(csvCell).join(',');
    });
    return '﻿' + head.join(',') + '\r\n' + rows.join('\r\n');
  }
  function saveFile(name, data) {
    if (!dl) return;
    dl.save({filename:name, data:data}).then(function () { toast('Archivo guardado'); }, function (e) {
      if (e && e.code === 'declined') return;
      toast('No se pudo guardar el archivo');
    });
  }
  function reportExport() {
    var t = todayStr();
    return h('section', {class:'group'}, h('h2', null, 'Descargar ', h('span', null, '· copia fuera de la página')),
      dl ? h('div', {class:'btnrow'},
        h('button', {class:'btn', type:'button', onclick:function () { saveFile('brownie-diario-' + t + '.csv', entriesCsv()); }}, 'Todos los registros (CSV)'),
        h('button', {class:'btn', type:'button', onclick:function () { saveFile('brownie-resumen-vet-' + t + '.txt', vetSummaryText()); }}, 'Resumen para el veterinario (TXT)'))
      : h('p', {class:'hint'}, 'La descarga no está disponible en esta vista. En la pestaña Resumen vet puedes copiar el texto.'),
      h('p', {class:'legend'}, 'El CSV abre en Excel e incluye notas y valores de laboratorio de todos los exámenes.'));
  }
  function viewReports() { return h('div', {class:'view'}, reportLabs(), reportWeeks(), reportExport()); }

  function viewDays() {
    var t = todayStr(), days = [];
    for (var i = 13; i >= 0; i--) days.push(addDays(t, -i));
    var by = {};
    entries.forEach(function (e) { (by[e.date] = by[e.date] || []).push(e); });
    var wd = new Intl.DateTimeFormat('es', {weekday:'narrow'});
    function cells(fn) { return days.map(fn); }
    var head = h('tr', null, h('th', null), cells(function (d) {
      return h('th', {class: d === t ? 'today' : ''}, h('div', null, cap(wd.format(parseYmd(d)))), h('div', null, String(parseYmd(d).getDate())));
    }));
    var moodRow = h('tr', null, h('th', null, 'Ánimo'), cells(function (d) {
      var ls = (by[d] || []).filter(function (e) { return e.type === 'mood' && num(det(e).level) != null; }).map(function (e) { return num(det(e).level); });
      if (!ls.length) return h('td', {class:'zero'}, '·');
      var avg = ls.reduce(function (a, b) { return a + b; }, 0) / ls.length;
      return h('td', {class:'m' + Math.min(5, Math.max(1, Math.round(avg))), title:'Ánimo ' + avg.toFixed(1) + '/5'}, avg % 1 ? avg.toFixed(1) : String(avg));
    }));
    var poopRow = h('tr', null, h('th', null, 'Popó'), cells(function (d) {
      var ps = (by[d] || []).filter(function (e) { return e.type === 'poop'; });
      if (!ps.length) return h('td', {class:'zero'}, '·');
      var n = ps.reduce(function (a, e) { return a + (num(det(e).count) || 1); }, 0), bad = ps.some(isBadPoop);
      return h('td', {class: bad ? 'flag' : '', title: bad ? 'Con sangre, moco o líquida' : ''}, String(n) + (bad ? '!' : ''));
    }));
    function countRow(label, type) {
      return h('tr', null, h('th', null, label), cells(function (d) {
        var n = (by[d] || []).filter(function (e) { return e.type === type && !isPlan(e); }).length;
        return h('td', {class: n ? '' : 'zero'}, n ? String(n) : '·');
      }));
    }
    return h('div', {class:'view'},
      h('div', {class:'gridwrap'}, h('table', {class:'days'}, h('thead', null, head),
        h('tbody', null, moodRow, poopRow, countRow('Comida', 'food'), countRow('Medicinas', 'med'), countRow('Síntomas', 'symptom')))),
      h('p', {class:'legend'}, 'Ánimo de 1 a 5 (promedio del día). El signo ! en popó marca sangre, moco o consistencia líquida.'));
  }

  window.__chatSaved = function (list) { (list || []).forEach(function (x) { chatLog.push({who:'saved', text:'Guardado · ' + (TYPES[x.type] ? TYPES[x.type].label : x.type) + ' · ' + x.title}); }); persistChat(); };

  /* ---------- arranque ---------- */
  function init() {
    $('nowLabel').textContent = cap(new Intl.DateTimeFormat('es', {weekday:'long', day:'numeric', month:'long', year:'numeric'}).format(new Date()));
    renderHero(); renderToday(); renderScreen();
    setInterval(renderRecent, 60000);
    var c = window.claude;
    function use(n) { return c && c.use ? Promise.resolve(c.use(n)).catch(function () { return null; }) : Promise.resolve(null); }
    Promise.all([use('db'), use('user'), use('downloads'), use('sample')]).then(function (r) {
      var db = r[0], user = r[1];
      sampleFn = typeof r[3] === 'function' ? r[3] : null;
      if (sampleFn && sampleFn.limits) sampleFn.limits().then(function (l) { toolsOk = !!(l && l.tools); renderComposer(); }).catch(function () { toolsOk = false; });
      dl = r[2] && r[2].save ? r[2] : null;
      if (!db) { col = null; renderScreen(); return; }
      col = db.collection('entries');
      var wp = user && user.can ? Promise.resolve(user.can('data.write')).catch(function () { return null; }) : Promise.resolve(null);
      wp.then(function (ok) { canWrite = ok !== false; renderDoses(); renderMeals(); renderScreen(); });
      col.orderBy('at', 'desc').limit(600).onSnapshot(function (snap) {
        entries = snap.docs.map(function (d) { return Object.assign({id:d.id}, d.data()); });
        loaded = true; renderAll();
      }, function () { loaded = true; col = null; renderScreen(); });
    });
  }
  init();
})();
</script>
